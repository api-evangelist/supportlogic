name: Supportlogic
description: >-
  SupportLogic is an enterprise AI infrastructure company for customer experience
  and support operations. Its Service Experience Data Cloud normalizes support
  data across cases, chat, and voice and enriches it with AI-driven sentiment and
  predictive signals, while ambient AI agents predict and prevent escalations,
  detect sentiment, automate case routing, draft replies and knowledge-base
  articles, and coach support teams. SupportLogic layers on top of existing
  ticketing/CRM stacks (Salesforce, Zendesk, Freshdesk, ServiceNow, Jira) and
  exposes its intelligence to AI clients through a first-party hosted MCP server
  that works with Claude, ChatGPT, and enterprise applications. Surfaced as a
  portfolio company of General Catalyst and Sierra Ventures and enriched by the
  API Evangelist pipeline.
