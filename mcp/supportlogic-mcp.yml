source: https://www.supportlogic.com/platform/mcp-server/
notes: >-
  SupportLogic advertises a first-party hosted/remote MCP server that connects
  its Service Experience Data Cloud to MCP clients (Claude, ChatGPT, and
  enterprise apps). The endpoint is tenant-scoped and generated from the
  SupportLogic Command Center (Settings -> MCP Server -> Generate Credentials).
  At probe time (2026-07-21) the advertised host mcp.supportlogic.com did not
  resolve publicly (NXDOMAIN) - the endpoint pattern below is taken verbatim
  from the product page and is expected to be provisioned per tenant. The tool
  catalog is transcribed from the product page, grouped as published; treat as a
  documented surface rather than a live-verified manifest.
server:
  name: supportlogic
  transport: http
  protocol: JSON-RPC 2.0
  url: https://mcp.supportlogic.com/v1/{tenant-id}
  auth:
    type: bearer
    note: Bearer token generated in the SupportLogic Command Center per tenant.
